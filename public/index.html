<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>System Dashboard</h1>
      <div class="status">
        <span id="refresh-indicator" class="pulse"></span>
        <span id="last-updated">Loading...</span>
      </div>
    </header>

    <div class="layout-row">
      <section class="section layout-left">
        <h2>Fastfetch <span class="subtitle">System Information</span></h2>
        <div id="sysinfo" class="sysinfo">
          <pre class="fastfetch-terminal">Loading fastfetch data...</pre>
        </div>
      </section>
      <section class="section layout-right">
        <h2>HTop <span class="subtitle">CPU, memory &amp; top processes</span></h2>
        <div id="htop-panel" class="htop-panel">
          <div class="logs-placeholder">Loading htop data...</div>
        </div>
      </section>
    </div>

    <section class="section">
      <h2>Storage <span class="subtitle">mounts &amp; disk space</span></h2>
      <div id="storage-panel" class="storage-panel">
        <div class="logs-placeholder">Loading storage...</div>
      </div>
    </section>

    <section class="section">
      <h2>Important Logs <span class="subtitle">warnings &amp; above</span></h2>
      <div id="logs-panel" class="logs-panel">
        <div class="logs-placeholder">Loading logs...</div>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
